spring:
  datasource:
    url: #${JDBC_DATABASE_URL:jdbc:postgresql://postgres:5432/epic_db}
    username: #${JDBC_DATABASE_USERNAME:epic}
    password: #${JDBC_DATABASE_PASSWORD:epic_password}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
    show-sql: true

server:
  port: 8082

springdoc:
  api-docs:
    path: /v3/api-docs
  swagger-ui:
    path: /swagger-ui.html

security:
  jwt:
    secret: #{JWT_SECRET_DEV}
    expiration: 3600000 # 1 hour in ms